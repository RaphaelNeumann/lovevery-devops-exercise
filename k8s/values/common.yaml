replicaCount: 2

image:
  repository: devops_exercise
  pullPolicy: Never
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

serviceAccount:
  create: true

service:
  type: ClusterIP
  port: 80

container:
  envFrom:
  - secretRef:
      name: devops-exercise-envs
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
